openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema

info:
  title: Faint Light
  version: 0.1.0a
  summary: Fast, self-hosted plate solving with a nova.astrometry.net-compatible API.
  description: |
    Faint Light implements the HTTP contract of nova.astrometry.net so that
    imaging software such as NINA can use it as a drop-in local replacement,
    Its own API lives at the root; the compatibility layer is served
    under `/nova`.

    Conventions shared by every operation:

    * **No authentication.** `/api/login` accepts any API key, or none, and
      always succeeds. The session token it returns is never checked.
    * **Trailing slashes are optional.** Every `/nova/...`
      path is served both with and without a trailing slash; only the
      slash-less form is listed here.
    * **Errors** are JSON: `{"status": "error", "errormessage": "..."}` with
      an HTTP status of 400, 404, 422, 501, 503 or 504 as documented per
      operation.
    * **Jobs are in memory.** A submission and its job are created together
      on upload (nova creates the job later; clients handle both). A server
      restart forgets all jobs.
    * **Request bodies** are limited to 256 MiB.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  contact:
    name: Faint Light
    url: https://nightsky.observer/faint-light/

externalDocs:
  description: Project page and benchmark
  url: https://nightsky.observer/faint-light/

servers:
  - url: http://localhost:7222
    description: Default port (`FAINT_LIGHT_PORT`)

tags:
  - name: nova
    description: The nova.astrometry.net contract, as consumed by NINA and the astrometry.net client.
  - name: results
    description: Solved calibrations and derived files.
  - name: solve
    description: The Faint Light API. One endpoint solves; flags add a FITS and an all-sky chart.
  - name: stubs
    description: Endpoints of the nova contract that Faint Light does not implement. Present so clients get a clean error.

paths:
  /:
    get:
      operationId: index
      summary: Server banner
      description: A short plain-text banner listing the two APIs. Handy as a liveness check. The web UI will live here.
      tags: [solve]
      responses:
        "200":
          description: Banner
          content:
            text/plain:
              schema:
                type: string
                examples: ["faint_light 0.1.0"]

  /api/v1/solve:
    post:
      operationId: solve
      summary: Solve an image
      description: |
        Solves in the request cycle — no polling. Two flags decide what else
        it produces; both extras are reported as URLs so one response can
        offer both and a browser can render the chart directly.

        `fits=true` builds the solved image as FITS. A FITS upload comes back
        as it arrived — same pixels, same extensions, same instrument cards —
        with its celestial WCS keywords replaced; every keyword of every
        convention is cleared first (`CDELT`, `CROTA`, `PC`, the SIP
        `A_i_j`/`B_i_j` polynomials), so a stale distortion term cannot be
        read alongside the new CD matrix. Any other format becomes a new
        `BITPIX = -32` image HDU holding the greyscale the solver measured.

        `skyview=true` places the field in the observer's sky and renders an
        SVG all-sky chart: zenith centred, horizon at the rim, North up, East
        left, constellation figures, and the image footprint outlined in red.
        It needs `timestamp`, `latitude` and `longitude`.

        Blocks for up to `FAINT_LIGHT_SOLVE_TIMEOUT` (default 300 s) plus 30 s
        of queueing grace. Outputs are cached for retrieval within a 256 MiB
        budget, oldest evicted first.
      tags: [solve]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  contentEncoding: binary
                  description: FITS, JPEG, PNG or TIFF.
                fits:
                  $ref: "#/components/schemas/Flag"
                skyview:
                  $ref: "#/components/schemas/Flag"
                timestamp:
                  type: string
                  description: Exposure time, UTC. Unix seconds or `YYYY-MM-DDTHH:MM:SS[.fff]Z`. Required with `skyview`.
                  examples: ["2026-01-15T02:30:00Z", "1768444200"]
                latitude:
                  type: string
                  description: Site latitude, degrees north-positive. Required with `skyview`.
                  examples: ["40.7128"]
                longitude:
                  type: string
                  description: Site longitude, degrees east-positive. Required with `skyview`.
                  examples: ["-74.0060"]
                scale_low:
                  type: string
                  description: Lower bound on the pixel scale, arcsec/px.
                scale_high:
                  type: string
                  description: Upper bound on the pixel scale, arcsec/px.
                center_ra:
                  type: string
                  description: Position hint, degrees.
                center_dec:
                  type: string
                  description: Position hint, degrees.
                radius:
                  type: string
                  description: Search radius around the position hint, degrees.
                downsample:
                  type: string
                  description: Downsample factor for star extraction. Chosen automatically when absent.
                parity:
                  type: string
                  enum: [normal, flip, both]
                  default: both
            encoding:
              file:
                contentType: image/fits, image/jpeg, image/png, image/tiff, application/octet-stream
      responses:
        "200":
          description: Solved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SolveResponse"
        "400":
          description: Missing or empty `file`, or an unusable option
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SolveError"
        "422":
          description: The solver could not solve the image, or the FITS could not be written
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SolveError"
        "503":
          description: Solve queue full
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "504":
          description: The solve did not finish within the budget
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/jobs/{id}/fits:
    get:
      operationId: solvedFits
      summary: The solved FITS for a job
      description: Produced by `POST /api/v1/solve` with `fits=true`. Served as an attachment named after the upload.
      tags: [solve]
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: The FITS file
          content:
            application/fits:
              schema:
                type: string
                contentEncoding: binary
        "404":
          description: The job produced no FITS, or it has been evicted from the cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SolveError"

  /api/v1/jobs/{id}/skyview.svg:
    get:
      operationId: skyviewChart
      summary: The all-sky chart for a job
      description: Produced by `POST /api/v1/solve` with `skyview=true`.
      tags: [solve]
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: SVG chart
          content:
            image/svg+xml:
              schema:
                type: string
        "404":
          description: The job produced no chart, or it has been evicted from the cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SolveError"

  /nova/api/login:
    post:
      operationId: login
      summary: Obtain a session
      description: |
        Always succeeds. The body is read only for a friendly log line: a
        `request-json` form field (URL-encoded, as NINA sends it, or
        multipart, as `curl -F` sends it) or a bare JSON body, any of which
        may carry `{"apikey": "..."}`. A missing or malformed body still logs
        in.
      tags: [nova]
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/RequestJsonForm"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/RequestJsonForm"
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"

  /nova/api/upload:
    post:
      operationId: upload
      summary: Submit an image for solving
      description: |
        Multipart upload of one image. Returns immediately with a submission
        id; poll `/api/submissions/{id}` for the job id, then `/api/jobs/{id}`
        until the status leaves `solving`, then read
        `/api/jobs/{id}/calibration`.

        Optional solve hints go in the `request-json` field as a JSON object
        (see `UploadRequestJson`). Without hints the solve is blind; Faint
        Light's warm start may still reuse the scale learned from earlier
        solves.

        Accepted image formats: FITS (BITPIX 8, 16, 32, -32 and -64, with
        BZERO/BSCALE applied, mono or multi-plane averaged to luma), JPEG,
        PNG and TIFF (8/16-bit, mono or RGB).
      tags: [nova]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  contentEncoding: binary
                  description: The image to solve.
                request-json:
                  $ref: "#/components/schemas/UploadRequestJson"
            encoding:
              file:
                contentType: image/fits, image/jpeg, image/png, image/tiff, application/octet-stream
              request-json:
                contentType: application/json
      responses:
        "200":
          description: Upload accepted and queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
        "400":
          description: No `file` field, empty file, or unreadable multipart body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Solve queue full. The job is recorded as failed; retry later.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /nova/api/url_upload:
    post:
      operationId: urlUpload
      summary: Not supported
      description: nova's fetch-by-URL upload. Faint Light does not fetch remote images.
      tags: [stubs]
      responses:
        "501":
          description: Not implemented
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /nova/api/submissions/{id}:
    get:
      operationId: submissionStatus
      summary: Submission status
      description: |
        Mirrors nova's submission record. Unlike nova, the `jobs` array is
        populated immediately after upload, so a client can skip straight to
        polling the job. `job_calibrations` lists `[job, job]` once the job has
        succeeded and is empty otherwise.
      tags: [nova]
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Submission record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionStatus"
        "404":
          $ref: "#/components/responses/NotFound"

  /nova/api/jobs/{id}:
    get:
      operationId: jobStatus
      summary: Job status
      description: Poll this until `status` is `success` or `failure`.
      tags: [nova]
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Current status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobStatus"
        "404":
          $ref: "#/components/responses/NotFound"

  /nova/api/jobs/{id}/calibration:
    get:
      operationId: jobCalibration
      summary: Solved calibration
      description: |
        The astrometric solution in nova's conventions. For JPEG, PNG and TIFF
        input the orientation and parity follow nova's convention for
        top-down raster images, so values agree with what nova would return
        for the same file.
      tags: [results]
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Calibration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Calibration"
        "404":
          description: No such job, or the job has not (yet) succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /nova/api/jobs/{id}/info:
    get:
      operationId: jobInfo
      summary: Job summary
      description: |
        Status, original filename, start time and, once solved, the
        calibration. Object identification is not implemented, so
        `objects_in_field`, `machine_tags` and `tags` are always empty.
      tags: [results]
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Job info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobInfo"
        "404":
          $ref: "#/components/responses/NotFound"

  /nova/api/jobs/{id}/objects_in_field:
    get:
      operationId: objectsInField
      summary: Objects in field (always empty)
      description: Present for contract compatibility. Object identification is not implemented; the list is always empty and the job id is not checked.
      tags: [results]
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Empty list
          content:
            application/json:
              schema:
                type: object
                required: [objects_in_field]
                properties:
                  objects_in_field:
                    type: array
                    items: { type: string }
                    maxItems: 0

  /nova/api/jobs/{id}/machine_tags:
    get:
      operationId: machineTags
      summary: Machine tags (always empty)
      description: Present for contract compatibility. Always empty; the job id is not checked.
      tags: [results]
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Empty list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagList"

  /nova/api/jobs/{id}/tags:
    get:
      operationId: tags
      summary: Tags (always empty)
      description: Present for contract compatibility. Always empty; the job id is not checked.
      tags: [results]
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Empty list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagList"

  /nova/api/jobs/{id}/annotations:
    get:
      operationId: annotations
      summary: Annotations (always empty)
      description: Present for contract compatibility. Always empty; the job id is not checked.
      tags: [results]
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Empty list
          content:
            application/json:
              schema:
                type: object
                required: [annotations]
                properties:
                  annotations:
                    type: array
                    items: { type: object }
                    maxItems: 0

  /nova/wcs_file/{id}:
    get:
      operationId: wcsFile
      summary: WCS as a FITS header
      description: |
        A minimal single-HDU FITS file (no data) carrying the solved TAN WCS:
        `CTYPE1/2`, `CRVAL1/2`, `CRPIX1/2` (1-based), the `CD` matrix,
        `IMAGEW` and `IMAGEH`. This is what astrometry.net's `solve-field`
        writes as `*.wcs`. No SIP distortion terms.
      tags: [results]
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: FITS header
          content:
            application/fits:
              schema:
                type: string
                contentEncoding: binary
        "404":
          description: No such job, or the job has not succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /nova/new_fits_file/{id}:
    get:
      operationId: newFitsFile
      summary: Not available
      description: nova's re-exported FITS image. Not produced by Faint Light.
      tags: [stubs]
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "404":
          $ref: "#/components/responses/NotFound"

  /nova/annotated_display/{id}:
    get:
      operationId: annotatedDisplay
      summary: Not available
      description: nova's annotated preview image. Not produced by Faint Light.
      tags: [stubs]
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "404":
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    id:
      name: id
      in: path
      required: true
      description: Submission or job id, as returned by the upload. Ids are small integers assigned from one counter, so a submission and its job never share an id.
      schema:
        type: integer
        format: int64
        minimum: 1

  responses:
    NotFound:
      description: No such submission or job
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [status, errormessage]
      properties:
        status:
          const: error
        errormessage:
          type: string
      examples:
        - status: error
          errormessage: no such job

    RequestJsonForm:
      type: object
      description: A form whose `request-json` field holds a JSON document as a string. This is how nova clients send every request body.
      properties:
        request-json:
          type: string
          contentMediaType: application/json
          examples: ['{"apikey": "anything"}']

    LoginRequest:
      type: object
      properties:
        apikey:
          type: string
          description: Ignored. Any value, or none, authenticates.
      additionalProperties: true

    LoginResponse:
      type: object
      required: [status, message, authenticated, session]
      properties:
        status:
          const: success
        message:
          type: string
          examples: ["authenticated user: anonymous"]
        authenticated:
          const: true
        session:
          type: string
          description: 32 hex characters. Never checked by the server.
          pattern: "^[0-9a-f]{32}$"

    UploadRequestJson:
      type: object
      description: |
        Solve hints, in nova's vocabulary. All fields are optional; numbers
        may also be sent as numeric strings. Unknown fields are ignored.

        Scale hints need `scale_units` plus either `scale_lower`/`scale_upper`
        (`scale_type: ul`, the default) or `scale_est`/`scale_err`
        (`scale_type: ev`, where `scale_err` is a percentage, default 20).
        With `scale_units` of `degwidth` (the default when the units are
        omitted) or `arcminwidth` the bounds describe the image width; with
        `arcsecperpix` they describe the pixel scale.

        A position hint needs `center_ra` and `center_dec`; `radius` bounds
        the search around it.
      properties:
        session:
          type: string
          description: Ignored.
        allow_commercial_use:
          type: string
          description: Ignored (nova licensing field).
        allow_modifications:
          type: string
          description: Ignored (nova licensing field).
        publicly_visible:
          type: string
          description: Ignored.
        scale_units:
          type: string
          enum: [degwidth, arcminwidth, arcsecperpix, app]
          description: Unit of the scale bounds. `app` is an alias of `arcsecperpix`. Defaults to `degwidth`.
        scale_type:
          type: string
          enum: [ul, ev]
          default: ul
        scale_lower:
          type: number
          description: "Lower scale bound (`scale_type: ul`), in `scale_units`."
        scale_upper:
          type: number
          description: "Upper scale bound (`scale_type: ul`), in `scale_units`."
        scale_est:
          type: number
          description: "Scale estimate (`scale_type: ev`), in `scale_units`."
        scale_err:
          type: number
          description: Allowed error around `scale_est`, in percent.
          default: 20
          minimum: 0
          maximum: 100
        center_ra:
          type: number
          description: Position hint, right ascension in degrees.
          minimum: 0
          maximum: 360
        center_dec:
          type: number
          description: Position hint, declination in degrees.
          minimum: -90
          maximum: 90
        radius:
          type: number
          description: Search radius around the position hint, degrees.
          exclusiveMinimum: 0
        downsample_factor:
          type: integer
          description: Downsample the image by this factor before star extraction.
          minimum: 1
        parity:
          type: integer
          enum: [0, 1, 2]
          description: "0: normal parity only, 1: flipped only, 2 (default): try both."
          default: 2
        tweak_order:
          type: integer
          description: Accepted and ignored. Faint Light fits a TAN solution without SIP distortion.
        crpix_center:
          type: boolean
          description: Accepted and ignored.
      additionalProperties: true
      examples:
        - scale_units: arcsecperpix
          scale_type: ul
          scale_lower: 1.5
          scale_upper: 3.0
          center_ra: 83.0
          center_dec: -5.0
          radius: 10
          downsample_factor: 2
          parity: 2
        - scale_units: degwidth
          scale_type: ev
          scale_est: 2.0
          scale_err: 10

    UploadResponse:
      type: object
      required: [status, subid, hash]
      properties:
        status:
          const: success
        subid:
          type: integer
          format: int64
          description: Submission id. Poll `/api/submissions/{subid}`.
        hash:
          type: string
          description: SHA-1 of the uploaded bytes, hex.
          pattern: "^[0-9a-f]{40}$"
      examples:
        - status: success
          subid: 1
          hash: 2fd4e1c67a2d28fced849ee1bb76e7391b93eb12

    NovaTime:
      type: string
      description: nova-style timestamp, UTC, `YYYY-MM-DD HH:MM:SS.ffffff`.
      pattern: "^\\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2}:\\d{2}\\.\\d{6}$"
      examples: ["2026-07-13 02:10:00.123456"]

    SubmissionStatus:
      type: object
      required: [processing_started, processing_finished, user, user_images, images, jobs, job_calibrations]
      properties:
        processing_started:
          $ref: "#/components/schemas/NovaTime"
        processing_finished:
          oneOf:
            - $ref: "#/components/schemas/NovaTime"
            - type: "null"
          description: Null until the job finishes (success or failure).
        user:
          const: 1
        user_images:
          type: array
          items: { type: integer, format: int64 }
          description: Always `[job]`.
        images:
          type: array
          items: { type: integer, format: int64 }
          description: Always `[job]`.
        jobs:
          type: array
          items: { type: integer, format: int64 }
          minItems: 1
          maxItems: 1
          description: The single job for this submission. Populated immediately.
        job_calibrations:
          type: array
          description: "`[[job, job]]` once the job has succeeded, otherwise empty."
          items:
            type: array
            items: { type: integer, format: int64 }
            minItems: 2
            maxItems: 2
      examples:
        - processing_started: "2026-07-13 02:10:00.000000"
          processing_finished: "2026-07-13 02:10:00.412000"
          user: 1
          user_images: [2]
          images: [2]
          jobs: [2]
          job_calibrations: [[2, 2]]

    JobStatusValue:
      type: string
      enum: [solving, success, failure]

    JobStatus:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/JobStatusValue"

    Calibration:
      type: object
      description: Astrometric solution in nova's conventions, plus the two `*_arcsec` size fields nova also returns.
      required: [ra, dec, radius, pixscale, orientation, parity, width_arcsec, height_arcsec]
      properties:
        ra:
          type: number
          description: Image-centre right ascension, degrees J2000.
          minimum: 0
          maximum: 360
        dec:
          type: number
          description: Image-centre declination, degrees J2000.
          minimum: -90
          maximum: 90
        radius:
          type: number
          description: Angular distance from the image centre to a corner, degrees.
        pixscale:
          type: number
          description: Arcseconds per pixel.
        orientation:
          type: number
          description: Position angle of image "up", degrees east of north.
        parity:
          type: number
          enum: [1, -1]
          description: Sign of the determinant of the CD matrix. `1` normal, `-1` flipped.
        width_arcsec:
          type: number
          description: Image width times `pixscale`.
        height_arcsec:
          type: number
          description: Image height times `pixscale`.
      examples:
        - ra: 279.234
          dec: -23.904
          radius: 1.87
          pixscale: 3.52
          orientation: 178.4
          parity: -1
          width_arcsec: 11274.2
          height_arcsec: 7395.9

    JobInfo:
      type: object
      required: [status, original_filename, started, objects_in_field, machine_tags, tags]
      properties:
        status:
          $ref: "#/components/schemas/JobStatusValue"
        original_filename:
          type: string
          description: The `file` part's filename, or `upload` when the client sent none.
        started:
          $ref: "#/components/schemas/NovaTime"
        calibration:
          $ref: "#/components/schemas/Calibration"
          description: Present when `status` is `success`.
        error_message:
          type: string
          description: Present when `status` is `failure`.
        objects_in_field:
          type: array
          items: { type: string }
          maxItems: 0
        machine_tags:
          type: array
          items: { type: string }
          maxItems: 0
        tags:
          type: array
          items: { type: string }
          maxItems: 0

    TagList:
      type: object
      required: [tags]
      properties:
        tags:
          type: array
          items: { type: string }
          maxItems: 0

    Flag:
      type: string
      description: A boolean form field. Absent is false; `1`, `true`, `yes`, `on` or an empty value (as an HTML checkbox posts) is true.
      examples: ["1", "true"]

    SolveResponse:
      type: object
      required: [status, job, solved_in_ms, image, calibration, wcs, match]
      properties:
        status:
          const: success
        job:
          type: integer
          format: int64
          description: Job id, and the `{id}` of the artifact paths below.
        solved_in_ms:
          type: integer
          description: Wall time for the whole request, milliseconds.
        image:
          type: object
          required: [width, height]
          properties:
            width:
              type: number
            height:
              type: number
        calibration:
          $ref: "#/components/schemas/Calibration"
        wcs:
          type: object
          description: The fitted TAN WCS, in FITS conventions (`crpix` 1-based).
          required: [crval, crpix, cd]
          properties:
            crval:
              type: array
              items: { type: number }
              minItems: 2
              maxItems: 2
            crpix:
              type: array
              items: { type: number }
              minItems: 2
              maxItems: 2
            cd:
              type: array
              description: Degrees per pixel, row-major.
              items:
                type: array
                items: { type: number }
                minItems: 2
                maxItems: 2
              minItems: 2
              maxItems: 2
        match:
          type: object
          required: [logodds, nmatch, index_id]
          properties:
            logodds:
              type: number
              description: Log-odds the verifier assigned to the accepted solution.
            nmatch:
              type: integer
              description: Index stars matched to extracted sources.
            index_id:
              type: integer
              description: Which astrometry.net index solved it, e.g. 4111.
        fits_url:
          type: string
          description: Present with `fits=true`. Path of the solved FITS.
          pattern: "^/api/v1/jobs/\\d+/fits$"
        fits_filename:
          type: string
          description: Present with `fits=true`. Suggested download name.
          examples: ["m42_light.solved.fits"]
        skyview:
          $ref: "#/components/schemas/SkyviewResult"

    SkyviewResult:
      type: object
      description: Present with `skyview=true`.
      required: [chart_url, alt, az, above_horizon, width_deg, height_deg, corners_radec, observer]
      properties:
        chart_url:
          type: string
          pattern: "^/api/v1/jobs/\\d+/skyview\\.svg$"
        alt:
          type: number
          description: Altitude of the field centre, degrees. Negative when below the horizon.
          minimum: -90
          maximum: 90
        az:
          type: number
          description: Azimuth of the field centre, degrees, north through east.
          minimum: 0
          maximum: 360
        above_horizon:
          type: boolean
        width_deg:
          type: number
        height_deg:
          type: number
        corners_radec:
          type: array
          description: RA/Dec of the four image corners in border order, starting at pixel (0, 0).
          minItems: 4
          maxItems: 4
          items:
            type: array
            prefixItems:
              - type: number
                description: RA, degrees
              - type: number
                description: Dec, degrees
            minItems: 2
            maxItems: 2
        observer:
          type: object
          required: [timestamp_utc, unix, latitude, longitude, lst_deg]
          properties:
            timestamp_utc:
              type: string
              description: The parsed exposure time, UTC.
            unix:
              type: number
              description: The same instant as Unix seconds.
            latitude:
              type: number
            longitude:
              type: number
            lst_deg:
              type: number
              description: Local sidereal time at the site and instant, degrees.
              minimum: 0
              maximum: 360

    SolveError:
      type: object
      description: The Faint Light API's error shape. The nova API under `/nova` uses `errormessage` instead.
      required: [status, error]
      properties:
        status:
          const: error
        error:
          type: string
        job:
          type: integer
          format: int64
          description: Present when the failure happened after a job was created.
      examples:
        - status: error
          error: no solution found
